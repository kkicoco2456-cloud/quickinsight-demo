<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuickInsight DataAgent Demo</title>
  <style>
    :root {
      --nav: #121a2b;
      --nav-2: #172235;
      --nav-3: #223047;
      --surface: #f4f7fb;
      --panel: #ffffff;
      --line: #dce3ee;
      --line-soft: #e9eef6;
      --text: #172033;
      --muted: #677286;
      --muted-2: #8a95a7;
      --blue: #246fe5;
      --blue-2: #e9f2ff;
      --green: #0c9b63;
      --green-2: #e9f8f1;
      --yellow: #b47a05;
      --yellow-2: #fff7df;
      --red: #c64040;
      --red-2: #fff0f0;
      --shadow: 0 12px 36px rgba(18, 26, 43, 0.10);
      --radius: 8px;
      --topbar: 56px;
      --sidebar: 240px;
      --platform-menu: 364px;
      --content-max: 1200px;
      --page-margin: clamp(24px, 3vw, 36px);
      --drawer: clamp(360px, 24vw, 400px);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--surface);
      color: var(--text);
    }

    body {
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: var(--topbar) 0 0;
      z-index: 4;
      background: rgba(18, 26, 43, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-rows: var(--topbar) minmax(0, 1fr);
      height: 100vh;
      min-height: 640px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      height: var(--topbar);
      padding: 0 18px;
      background: #fff;
      color: #172033;
      border-bottom: 1px solid var(--line-soft);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      color: inherit;
      background: transparent;
      transition: background 140ms ease, transform 140ms ease;
    }

    .icon-btn:hover {
      background: #f4f7fb;
    }

    .icon-btn:active {
      transform: translateY(1px);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 210px;
      gap: 10px;
      font-weight: 700;
      font-size: 19px;
      white-space: nowrap;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
    }

    .platform-menu {
      position: fixed;
      top: var(--topbar);
      left: 0;
      bottom: 0;
      z-index: 6;
      display: grid;
      grid-template-rows: minmax(0, 1fr) 58px;
      width: min(var(--platform-menu), 92vw);
      background: #fff;
      border-right: 1px solid var(--line);
      box-shadow: 16px 0 32px rgba(18, 26, 43, 0.14);
      transform: translateX(-100%);
      transition: transform 180ms ease;
    }

    body.nav-open .platform-menu {
      transform: translateX(0);
    }

    .platform-menu-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      column-gap: 36px;
      align-content: start;
      overflow: auto;
      padding: 24px 18px 18px;
    }

    .platform-column {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 26px;
    }

    .platform-group {
      min-width: 0;
    }

    .platform-group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: #263147;
      font-size: 14px;
      line-height: 20px;
      font-weight: 750;
    }

    .platform-group-title .icon {
      width: 16px;
      height: 16px;
      color: #526077;
    }

    .platform-menu-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .platform-link {
      min-height: 24px;
      padding: 2px 0 2px 24px;
      border-radius: 4px;
      background: transparent;
      color: #465266;
      font-size: 12px;
      line-height: 20px;
      text-align: left;
    }

    .platform-link:hover,
    .platform-link.active {
      color: var(--blue);
      font-weight: 750;
    }

    .platform-menu-footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid var(--line-soft);
      background: #fff;
    }

    .platform-footer-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #2d3748;
      background: transparent;
      font-size: 14px;
      line-height: 20px;
      font-weight: 750;
    }

    .platform-footer-button:hover {
      color: var(--blue);
      background: #f7f9fc;
    }

    .top-spacer {
      flex: 1;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 26px;
      color: #172033;
      font-size: 14px;
      white-space: nowrap;
    }

    .account {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      max-width: 240px;
      padding-left: 14px;
      border-left: 1px solid var(--line-soft);
      font-weight: 600;
    }

    .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #eef3ff;
      color: #21304f;
      font-size: 13px;
      flex: 0 0 auto;
    }

    .account-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .main {
      display: flex;
      min-height: 0;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      flex: 0 0 var(--sidebar);
      width: var(--sidebar);
      min-width: 0;
      padding: 14px 12px;
      background: #fff;
      color: #172033;
      box-shadow: inset -1px 0 var(--line-soft);
    }

    .new-chat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 48px;
      padding: 0 12px;
      border: 1px solid var(--blue);
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(36, 111, 229, 0.16);
    }

    .section-label {
      margin: 26px 8px 10px;
      color: #465266;
      font-size: 13px;
      font-weight: 700;
    }

    .history {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }

    .history-item-wrap {
      position: relative;
    }
    
    .history-item {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-height: 42px;
      width: 100%;
      padding: 0 32px 0 8px;
      border-radius: 6px;
      background: transparent;
      color: #253149;
      text-align: left;
    }

    .history-item:hover,
    .history-item.active {
      background: #f4f7fb;
    }

    .history-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 5px;
      background: #eef3ff;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
    }

    .history-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 650;
      user-select: none;
    }

    .history-rename-input {
      width: 100%;
      background: #fff;
      border: 1px solid var(--blue);
      color: #172033;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 14px;
      outline: none;
    }

    .history-more-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      display: none;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #8a95a7;
      border-radius: 4px;
      cursor: pointer;
      z-index: 2;
    }

    .history-item-wrap:hover .history-more-btn {
      display: flex;
    }

    .history-more-btn:hover {
      background: #eef3ff;
      color: var(--blue);
    }

    .history-dropdown {
      position: fixed;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      min-width: 140px;
      box-shadow: 0 8px 24px rgba(18, 26, 43, 0.14);
      padding: 6px 0;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      color: #253149;
      font-size: 13px;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background: #f4f7fb;
    }

    .dropdown-item svg {
      width: 16px;
      height: 16px;
    }
    .dropdown-item.danger {
      color: #ff6b6b;
    }
    .dropdown-item.danger:hover {
      background: rgba(255, 107, 107, 0.1);
    }

    .workspace {
      display: grid;
      grid-template-rows: 54px minmax(0, 1fr);
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      background: var(--surface);
    }

    .context-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 0 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--line-soft);
    }

    .topic-pill {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 7px;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      color: #253149;
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(18, 26, 43, 0.04);
    }

    .topic-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px var(--green-2);
      flex: 0 0 auto;
    }

    .topic-name,
    .topic-path {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topic-path {
      color: #586274;
      font-weight: 600;
    }

    .dictionary-open {
      min-width: 88px;
      height: 34px;
      padding: 0 12px;
      border-radius: 6px;
      background: transparent;
      color: var(--blue);
      font-weight: 800;
      margin-left: auto;
    }

    .dictionary-open:hover {
      background: var(--blue-2);
    }

    .context-empty {
      color: var(--muted);
      font-weight: 650;
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--drawer);
      min-width: 0;
      min-height: 0;
      position: relative;
      overflow: hidden;
      transition: grid-template-columns 180ms ease;
    }

    .stage.drawer-closed {
      grid-template-columns: minmax(0, 1fr) 0;
    }

    .chat-column {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      position: relative;
      background: var(--surface);
    }

    .chat-scroll {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 42px var(--page-margin) 26px;
    }

    .topic-chooser {
      width: 100%;
      max-width: 764px;
      margin: 96px auto 0;
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(18, 26, 43, 0.07);
    }

    .topic-title {
      margin: 0 0 16px;
      font-size: 24px;
      line-height: 28px;
      color: #172033;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .topic-subtitle {
      margin: 0 0 16px;
      font-size: 20px;
      line-height: 24px;
      color: #555a65;
      font-weight: 700;
    }

    .tree {
      display: flex;
      flex-direction: column;
      gap: 14px;
      color: #3a4252;
      font-size: 18px;
      line-height: 26px;
    }

    .tree-row {
      display: flex;
      align-items: center;
      min-height: 26px;
      gap: 8px;
    }

    .tree-row.level-1 {
      padding-left: 37px;
    }

    .tree-row.level-2 {
      padding-left: 84px;
    }

    .domain-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 26px;
      padding: 0;
      border-radius: 6px;
      background: transparent;
      color: #3a4252;
      font-size: 18px;
      line-height: 26px;
      text-align: left;
    }

    .domain-toggle:hover {
      color: #1f2937;
    }

    .topic-link {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--blue);
      font-size: 18px;
      font-weight: 750;
      text-align: left;
      line-height: 26px;
      overflow-wrap: anywhere;
    }

    .topic-link:hover {
      color: #145fc9;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .carets {
      color: var(--blue);
      font-size: 16px;
      line-height: 16px;
      flex: 0 0 auto;
    }

    .root-label {
      padding-left: 0;
    }

    .message-stack {
      width: 100%;
      max-width: var(--content-max);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message-row {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      min-width: 0;
      width: 100%;
    }

    .message-row.user {
      display: flex;
      justify-content: flex-end;
      width: 100%;
    }

    .agent-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 7px;
      background: #dff6ee;
      color: #11805a;
      font-weight: 800;
    }

    .bubble {
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(18, 26, 43, 0.04);
      min-width: 0;
      overflow: hidden;
    }

    .user-bubble {
      max-width: min(520px, 100%);
      width: fit-content;
      word-break: break-word;
      white-space: pre-wrap;
      min-height: 46px;
      padding: 13px 18px;
      border-radius: 8px 8px 2px 8px;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.55;
      box-shadow: 0 8px 20px rgba(36, 111, 229, 0.18);
    }

    .warm-card {
      padding: 20px 22px 22px;
    }

    .warm-card h2 {
      margin: 0 0 14px;
      font-size: 18px;
      line-height: 1.4;
    }

    .warm-card p {
      margin: 0 0 18px;
      color: #485365;
      line-height: 1.6;
      font-weight: 650;
    }

    .suggestion-list {
      display: flex;
      flex-wrap: nowrap;
      gap: 12px;
      border-top: 1px solid var(--line-soft);
      padding-top: 16px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .suggestion-list::-webkit-scrollbar {
      height: 6px;
      display: block;
    }
    .suggestion-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .suggestion-list::-webkit-scrollbar-thumb {
      background: #e1e7f0;
      border-radius: 4px;
    }
    .suggestion-list::-webkit-scrollbar-thumb:hover {
      background: #c3cedf;
    }

    .suggestion {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fafcff;
      color: #253149;
      font-weight: 700;
      box-shadow: 0 1px 1px rgba(18, 26, 43, 0.04);
      white-space: nowrap;
    }

    .suggestion:hover {
      border-color: #b8cef5;
      color: var(--blue);
      background: #fff;
    }

    .answer {
      overflow: hidden;
    }

    .answer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 54px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .answer-state {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 17px;
      font-weight: 850;
    }

    .duration {
      color: #6c7688;
      font-size: 15px;
      font-weight: 750;
    }

    .link-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 10px;
      border-radius: 6px;
      background: transparent;
      color: #2a3345;
      font-weight: 750;
    }

    .link-button:hover {
      background: #f2f5fa;
    }

    .link-button .icon {
      width: 15px;
      height: 15px;
      stroke-width: 2.4;
    }

    .answer-body {
      padding: 22px 18px 22px;
    }

    .answer-title {
      margin: 0 0 16px;
      font-size: 18px;
      line-height: 1.45;
      font-weight: 850;
    }

    .ai-inference-hint {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0 0 16px;
      padding: 14px 16px;
      border-radius: 6px;
      background: #fef8ec;
      color: #b47a05;
      font-size: 13px;
      font-weight: 650;
      border: 1px solid #fdeec8;
      line-height: 1.5;
    }
    
    .ai-inference-hint strong {
      font-weight: 800;
      color: #9a6600;
    }

    .ai-inference-hint p {
      margin: 0;
    }

    .ai-notice-title {
      display: block;
      margin: 0 0 8px;
    }

    .ai-notice-lines {
      display: grid;
      gap: 8px;
    }

    .ai-notice-lines.with-summary {
      margin-top: 8px;
    }

    .out-scope-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #d93026;
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .out-scope-desc {
      color: #333;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 16px;
    }
    .out-scope-suggestions {
      background: #f4f6f9;
      border-radius: 8px;
      padding: 16px;
    }
    .suggest-title {
      font-size: 13px;
      color: #555;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .suggest-item {
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      cursor: pointer;
      line-height: 1.5;
    }
    .suggest-item:last-child {
      margin-bottom: 0;
    }
    .suggest-item:hover {
      text-decoration: underline;
    }

    .analysis-block {
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdff;
      overflow: hidden;
    }

    .analysis-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 48px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line-soft);
      background: #f8fbff;
      font-weight: 850;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }

    .analysis-toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .analysis-toggle-label .icon {
      width: 16px;
      height: 16px;
      stroke-width: 2.4;
    }

    .analysis-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .blue-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 4px var(--blue-2);
    }

    .param-grid-wrap {
      display: none;
    }
    .analysis-block.is-open .param-grid-wrap {
      display: block;
    }

    .analysis-toggle-label .toggle-text::before {
      content: "展开";
    }
    .analysis-block.is-open .analysis-toggle-label .toggle-text::before {
      content: "收起";
    }

    .analysis-toggle-label .icon-collapse {
      display: none;
    }
    .analysis-block.is-open .analysis-toggle-label .icon-expand {
      display: none;
    }
    .analysis-block.is-open .analysis-toggle-label .icon-collapse {
      display: flex;
    }
    .icon-expand, .icon-collapse {
      display: flex;
      align-items: center;
    }

    .param-grid {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 10px 14px;
      padding: 14px;
    }

    .param-label {
      color: #596477;
      font-weight: 800;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      background: var(--green-2);
      color: #2d624e;
      font-weight: 750;
      white-space: nowrap;
    }

    .tag.blue {
      background: var(--blue-2);
      color: #245cad;
    }

    .tag.gray {
      background: #eef2f7;
      color: #566175;
    }

    .insight-box {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr);
      gap: 8px 14px;
      margin: 0 0 16px;
      padding: 14px 16px;
      border: 1px solid #cfe2ff;
      border-radius: 8px;
      background: #f5faff;
      line-height: 1.7;
    }

    .insight-label {
      color: #1c65c9;
      font-weight: 850;
    }

    .viz-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 8px;
    }

    .metric-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #334157;
      font-weight: 850;
    }

    .tiny-line {
      width: 18px;
      height: 4px;
      border-radius: 4px;
      background: #5b9df5;
    }

    .view-tabs {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f7f9fc;
      overflow: hidden;
    }

    .view-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 46px;
      height: 34px;
      border-right: 1px solid var(--line);
      background: transparent;
      color: #617085;
    }

    .view-tab:last-child {
      border-right: 0;
    }

    .view-tab.active {
      background: #fff;
      color: var(--blue);
      box-shadow: inset 0 -2px 0 var(--blue);
    }

    .metric-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 14px;
      margin: 8px 0 4px;
    }

    .metric-value {
      font-size: 34px;
      line-height: 1.2;
      font-weight: 900;
      color: #141d31;
    }

    .unit {
      font-size: 16px;
      font-weight: 800;
    }

    .up {
      color: #c95362;
      font-weight: 850;
    }

    .chart-wrap {
      width: 100%;
      overflow: hidden;
    }

    .chart-svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 320px;
    }

    .chart-point {
      cursor: pointer;
      transition: r 160ms ease, stroke-width 160ms ease, filter 160ms ease;
    }

    .chart-point:hover {
      r: 7;
      stroke-width: 5;
      filter: drop-shadow(0 2px 6px rgba(62, 140, 240, 0.28));
    }

    .chart-tooltip {
      position: fixed;
      z-index: 1000;
      min-width: 168px;
      max-width: 280px;
      padding: 10px 12px;
      border: 1px solid #dce3ee;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 4px 16px rgba(18, 26, 43, 0.10);
      opacity: 0;
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      transition: opacity 120ms ease;
      white-space: nowrap;
    }

    .chart-tooltip.show {
      opacity: 1;
    }

    .chart-tooltip-context {
      color: #677286;
      font-size: 12px;
      line-height: 18px;
      font-weight: 650;
    }

    .chart-tooltip-metric {
      margin-top: 4px;
      color: #172033;
      font-size: 13px;
      line-height: 20px;
      font-weight: 650;
    }

    .chart-tooltip-value {
      font-weight: 850;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      font-size: 14px;
    }

    .data-table th,
    .data-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line-soft);
      text-align: left;
      vertical-align: middle;
      line-height: 1.45;
    }

    .data-table th {
      background: #f0f3f8;
      color: #3c4658;
      font-weight: 850;
    }

    .data-table tr:last-child td {
      border-bottom: 0;
    }

    .number {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .sql-block {
      margin: 0;
      padding: 16px;
      border-radius: 8px;
      background: #111827;
      color: #d8e5ff;
      overflow: auto;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre;
    }

    .process-step {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 10px;
      padding: 12px 0;
      color: #485365;
      line-height: 1.55;
      border-bottom: 1px solid var(--line-soft);
    }

    .process-step:last-child {
      border-bottom: 0;
    }

    .step-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--blue-2);
      color: var(--blue);
      font-size: 12px;
      font-weight: 850;
    }

    .alert {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 12px;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--line);
      line-height: 1.65;
      background: #fff;
    }

    .alert h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .alert p {
      margin: 0;
      color: #4f5a6d;
    }

    .alert.warning {
      border-color: #f0d38a;
      background: var(--yellow-2);
    }

    .alert.danger {
      border-color: #f0b9b9;
      background: var(--red-2);
    }

    .alert.neutral {
      background: #f7f9fc;
    }

    .alert-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 7px;
      background: #fff;
      color: currentColor;
    }

    .warning .alert-icon {
      color: var(--yellow);
    }

    .danger .alert-icon {
      color: var(--red);
    }

    .result-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 14px;
    }

    .mini-result {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .mini-result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 0 14px;
      background: #f8fbff;
      border-bottom: 1px solid var(--line-soft);
      font-weight: 850;
    }

    .mini-result-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 42px;
      padding: 0 14px;
      background: #f8fbff;
      font-weight: 850;
      text-align: left;
    }

    .mini-result-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #24533e;
    }

    .mini-result-status .icon {
      width: 16px;
      height: 16px;
      stroke-width: 2.4;
    }

    .mini-result-body {
      padding: 14px;
      color: #4f5a6d;
      line-height: 1.7;
    }

    .mini-result-panel {
      border-top: 1px solid var(--line-soft);
      padding: 16px;
    }

    .mini-result-panel .answer-title {
      margin-top: 0;
    }

    .small-bar-chart {
      display: grid;
      gap: 18px;
      margin-top: 22px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr) 72px;
      align-items: center;
      gap: 16px;
      min-height: 28px;
      font-size: 15px;
      font-weight: 750;
      color: #172033;
    }

    .bar-track {
      height: 10px;
      border-radius: 999px;
      background: #eaf0f7;
      overflow: hidden;
    }

    .bar-fill {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: #3e8cf0;
      transition: width 220ms ease;
    }

    .bar-value {
      text-align: right;
      font-size: 15px;
      font-weight: 850;
      color: #172033;
    }

    .answer-feedback {
      display: grid;
      gap: 10px;
      padding: 9px 18px;
      border-top: 1px solid var(--line-soft);
      background: #fff;
    }

    .feedback-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
    }

    .feedback-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: transparent;
      color: #5f6b7e;
      transition: background 140ms ease, color 140ms ease, transform 140ms ease;
    }

    .feedback-button:hover {
      background: #f1f5fb;
      color: #233049;
    }

    .feedback-button.active {
      background: var(--blue-2);
      color: var(--blue);
    }

    .feedback-button:active {
      transform: translateY(1px);
    }

    .feedback-hint {
      margin-left: 4px;
      color: var(--muted-2);
      font-size: 12px;
      font-weight: 700;
    }

    .feedback-comment {
      display: grid;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: #f8fbff;
    }

    .comment-input-wrap {
      position: relative;
      width: 100%;
    }

    .feedback-comment textarea {
      width: 100%;
      min-height: 76px;
      resize: none;
      overflow: hidden;
      padding: 12px 12px 48px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: 0;
      color: #263147;
      line-height: 1.55;
      background: #fff;
    }

    .feedback-comment textarea:focus {
      border-color: #a9c7fb;
      box-shadow: 0 0 0 3px var(--blue-2);
    }

    .comment-actions {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
    }

    .comment-save {
      position: absolute;
      right: 12px;
      bottom: 12px;
      min-width: 82px;
      height: 32px;
      padding: 0 16px;
      border-radius: 6px;
      background: var(--blue);
      color: #fff;
      font-weight: 850;
      box-shadow: 0 4px 10px rgba(36, 111, 229, 0.15);
      transition: background 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }

    .comment-save:hover {
      background: #1e61ca;
    }

    .comment-save:disabled {
      cursor: not-allowed;
      background: #d8e0eb;
      color: #8b96a8;
      box-shadow: none;
    }

    .saved-comments-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: #f8fbff;
    }
    
    .saved-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .saved-item {
      color: #566175;
      font-size: 13px;
      line-height: 1.5;
    }
    .saved-item .time {
      color: #9aa4b7;
      font-size: 12px;
      margin-left: 6px;
    }

    .composer-wrap {
      padding: 14px var(--page-margin) 18px;
      background: linear-gradient(180deg, rgba(244, 247, 251, 0), #fff 18%);
      min-width: 0;
    }

    .composer-wrap[hidden] {
      display: none;
    }

    .quick-chips {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 8px;
      width: 100%;
      max-width: var(--content-max);
      margin: 0 auto 10px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .quick-chips::-webkit-scrollbar {
      height: 6px;
      display: block; 
    }
    .quick-chips::-webkit-scrollbar-track {
      background: transparent;
    }
    .quick-chips::-webkit-scrollbar-thumb {
      background: #dce3ee;
      border-radius: 4px;
    }
    .quick-chips::-webkit-scrollbar-thumb:hover {
      background: #b9c7df;
    }

    .chip {
      flex: 0 0 auto;
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #526077;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .chip:hover {
      color: var(--blue);
      border-color: #c7d9fa;
      background: var(--blue-2);
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 102px;
      gap: 12px;
      width: 100%;
      max-width: var(--content-max);
      min-height: 92px;
      margin: 0 auto;
      padding: 12px;
      border: 1px solid #cad3df;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(18, 26, 43, 0.08);
    }

    .composer-field {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
    }

    .composer textarea {
      width: 100%;
      height: 68px;
      min-height: 68px;
      max-height: 68px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 4px 2px;
      color: #263147;
      line-height: 1.6;
    }

    .send {
      align-self: end;
      height: 42px;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-weight: 850;
      box-shadow: 0 8px 18px rgba(36, 111, 229, 0.18);
    }

    .send:hover {
      background: #1e61ca;
    }

    .dictionary {
      display: grid;
      grid-template-rows: 54px auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      border-left: 1px solid var(--line);
      background: #fff;
      box-shadow: -8px 0 22px rgba(18, 26, 43, 0.05);
      transform: none;
      transition: opacity 160ms ease;
      overflow: hidden;
    }

    .stage.drawer-closed .dictionary {
      opacity: 0;
      pointer-events: none;
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line-soft);
      font-size: 17px;
      font-weight: 850;
    }

    .drawer-head .icon-btn {
      color: #273349;
    }

    .drawer-search {
      padding: 14px 18px;
    }

    .search-field {
      position: relative;
    }

    .drawer-search input {
      width: 100%;
      height: 40px;
      padding: 0 42px 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      color: #263147;
    }

    .drawer-search input:focus {
      border-color: #a9c7fb;
      box-shadow: 0 0 0 3px var(--blue-2);
    }

    .dict-clear {
      position: absolute;
      top: 50%;
      right: 8px;
      width: 28px;
      height: 28px;
      transform: translateY(-50%);
      border-radius: 6px;
      background: transparent;
      color: #273349;
    }

    .dict-clear:hover {
      background: #f2f5fa;
    }

    .dict-clear[hidden] {
      display: none;
    }

    .dict-table-wrap {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 18px 18px;
    }

    .dictionary[aria-label="分析过程"] .dict-table-wrap {
      padding-top: 18px;
    }

    .drawer-copy {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: #f8fbff;
      line-height: 1.6;
    }

    .drawer-copy h3 {
      margin: 0 0 6px;
      font-size: 16px;
      line-height: 1.45;
    }

    .drawer-copy p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .analysis-process-list {
      padding: 2px 2px 8px;
    }

    .dict-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line-soft);
      table-layout: fixed;
      font-size: 14px;
    }

    .dict-table th,
    .dict-table td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--line-soft);
      border-right: 1px solid var(--line-soft);
      text-align: left;
      vertical-align: top;
      line-height: 1.5;
      word-break: break-word;
    }

    .dict-table th:last-child,
    .dict-table td:last-child {
      border-right: 0;
    }

    .dict-table th {
      background: #e5e7eb;
      color: #414b5c;
      font-weight: 850;
    }

    .field-name {
      width: 34%;
      font-weight: 800;
      color: #4c5668;
      vertical-align: middle;
    }

    .field-name.field-match {
      color: var(--blue);
    }

    .definition-list {
      display: grid;
      gap: 6px;
      color: #1f2937;
      font-weight: 650;
    }

    .definition-item {
      margin: 0;
    }

    .definition-label {
      color: #4c5668;
      font-weight: 850;
    }

    .empty-dict {
      padding: 24px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 8px;
    }

    .loading-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 0 18px;
      font-weight: 850;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid #d7e6ff;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 820ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      position: fixed;
      left: var(--toast-left, 50%);
      bottom: 22px;
      transform: translateX(-50%) translateY(12px);
      z-index: 10;
      min-height: 40px;
      max-width: min(520px, calc(100vw - 32px));
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(18, 26, 43, 0.92);
      color: #fff;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex: 0 0 auto;
    }

    @media (max-width: 1487px) {
      :root {
        --content-max: calc(100vw - var(--sidebar) - (var(--page-margin) * 2));
        --page-margin: 24px;
      }
    }

    @media (max-width: 1280px) {
      :root {
        --sidebar: 220px;
        --drawer: 340px;
      }

      .stage {
        grid-template-columns: minmax(0, 1fr) var(--drawer);
      }

      .chat-scroll {
        padding: 32px 24px 24px;
      }

      .composer-wrap {
        padding-left: 24px;
        padding-right: 24px;
      }
    }

    @media (max-width: 1080px) {
      :root {
        --drawer: 360px;
      }
    }

    @media (max-width: 860px) {
      :root {
        --content-max: 100%;
        --page-margin: 14px;
      }

      body {
        overflow: auto;
        overflow-x: hidden;
      }

      .app {
        min-height: 100vh;
        height: auto;
      }

      .top-links,
      .account-name {
        display: none;
      }

      .brand {
        min-width: 0;
      }

      .main {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        top: var(--topbar);
        left: 0;
        bottom: 0;
        z-index: 6;
        display: flex;
        width: min(300px, 84vw);
        transform: translateX(-100%);
        transition: transform 180ms ease;
        box-shadow: var(--shadow);
      }

      body.nav-open {
        overflow: hidden;
      }

      body.nav-open::before {
        opacity: 1;
        pointer-events: auto;
      }

      body.nav-open .sidebar {
        transform: translateX(0);
      }

      .workspace {
        min-height: calc(100vh - var(--topbar));
      }

      .context-bar {
        gap: 8px;
        padding: 0 10px;
      }

      .topic-pill {
        flex: 1 1 auto;
        min-width: 0;
        padding: 0 10px;
      }

      .topic-path {
        display: none;
      }

      .dictionary-open {
        min-width: 74px;
        padding: 0 8px;
        white-space: nowrap;
      }

      .stage {
        grid-template-columns: minmax(0, 1fr) min(340px, 46vw);
      }

      .stage.drawer-closed {
        grid-template-columns: minmax(0, 1fr) 0;
      }

      .tree-row {
        align-items: flex-start;
      }

      .chat-scroll {
        width: 100%;
        max-width: 100vw;
        min-width: 0;
        overflow-x: hidden;
        padding: 22px 14px 18px;
      }

      .topic-chooser {
        width: min(100%, calc(100vw - 28px));
        margin-top: 28px;
        padding: 24px 20px;
      }

      .composer-wrap {
        width: 100%;
        max-width: 100vw;
        min-width: 0;
        overflow-x: hidden;
        padding: 12px 12px 16px;
      }

      .message-stack,
      .quick-chips,
      .composer {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }

      .message-row,
      .message-row.user,
      .bubble,
      .warm-card,
      .answer {
        min-width: 0;
      }

      .bubble {
        width: 100%;
      }

      .user-bubble,
      .answer-title,
      .warm-card h2,
      .warm-card p {
        overflow-wrap: anywhere;
      }

      .tag {
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .composer {
        grid-template-columns: 1fr;
      }

      .composer-field {
        min-width: 0;

      .send {

      .message-row {
        grid-template-columns: 34px minmax(0, 1fr);

      }

      body.nav-open .sidebar {
        transform: translateX(-100%);

  <script>
    const topics = {

        ],
        dict: [
          {

            details: [
              ["业务过程", "正向支付"],

          },

              ["描述对象", "支付交易"],
              ["枚举示例", "Card、Wallet、Bank Transfer、Alternative Payment"]

    const demoQuestions = [
      "分析店铺最近售卖情况",
      "广州最近天气怎么样，分析店铺售卖情况",
      "分析最近7天正向支付GMV趋势",
      "最近拒付率怎么样",
      "广州最近天气怎么样",
      "今天会下雨吗",
      "分析最近7天各来源渠道访客转化率趋势",
      "查询火星门店GMV",
      "访客转化率和投放ROI一起看",
      "同时分析访客、支付、退款、库存、客诉、ROI"
    ];

    const createNewSessionId = () => 'sess_' + Date.now() + Math.random().toString(36).substr(2, 5);

    const state = {
      currentSessionId: createNewSessionId(),
      sessions: [
        { id: 'mock_1', title: '华东区一季度销售额查询', topicKey: 'payment', messages: [] },
        { id: 'mock_2', title: '周度运营指标深度拆解', topicKey: 'visitor', messages: [] },
        { id: 'mock_3', title: '全量跨年复购漏斗计算', topicKey: 'payment', messages: [] }
      ],
      topic: null,
      messages: [],
      drawerOpen: false,
      drawerMode: "dictionary",
      dictQuery: "",
      activeView: "chart",
      paramsOpen: false,
      activeProcessId: null,
      messageSeq: 1,
      multiExpanded: {},
      topicTree: {
        behavior: false,
        payment: false
      },
      loading: false,
      openDropdownId: null, 
      renamingId: null,
      dropdownPos: { top: '0px', left: '0px' },
      keepScrollPosition: false
    };

    const els = {
      contextBar: document.getElementById("contextBar"),
      stage: document.getElementById("stage"),
      chatScroll: document.getElementById("chatScroll"),
      historyList: document.getElementById("historyList"),
      composerWrap: document.querySelector(".composer-wrap"),
      quickChips: document.getElementById("quickChips"),
      composer: document.getElementById("composer"),
      input: document.getElementById("questionInput"),
      dictionaryDrawer: document.getElementById("dictionaryDrawer"),
      drawerTitle: document.getElementById("drawerTitle"),
      drawerSearch: document.getElementById("drawerSearch"),
      dictTableWrap: document.getElementById("dictTableWrap"),
      dictSearch: document.getElementById("dictSearch"),
      clearDictSearch: document.getElementById("clearDictSearch"),
      toast: document.getElementById("toast")
    };

    function icon(name) {
      const paths = {
        table: '<path d="M3 5h18v14H3z"/><path d="M3 10h18M9 5v14"/>',
        chart: '<path d="M4 19h16"/><path d="m6 15 4-4 3 3 5-7"/>',
        sql: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h5M8 17h8"/>',
        alert: '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="m10.3 3.9-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3.1l-8-14a2 2 0 0 0-3.4 0Z"/>',
        shield: '<path d="M12 3 5 6v6c0 4.6 2.9 7.6 7 9 4.1-1.4 7-4.4 7-9V6l-7-3Z"/><path d="m9 12 2 2 4-4"/>',
        info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
        check: '<path d="m20 6-11 11-5-5"/>',
        copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/>',
        thumbsUp: '<path d="M7 10v11"/><path d="M15 5.9 14 10h5.8a2 2 0 0 1 2 2.3l-1.4 7a2 2 0 0 1-2 1.7H7"/><path d="M7 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/><path d="M14 10V5.9A2.9 2.9 0 0 0 11.1 3L7 10"/>',
        thumbsDown: '<path d="M17 14V3"/><path d="m9 18.1 1-4.1H4.2a2 2 0 0 1-2-2.3l1.4-7a2 2 0 0 1 2-1.7H17"/><path d="M17 14h3a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-3"/><path d="M10 14v4.1A2.9 2.9 0 0 0 12.9 21L17 14"/>',
        chevronRight: '<path d="m9 18 6-6-6-6"/>',
        chevronDown: '<path d="m6 9 6 6 6-6"/>',
        chevronUp: '<path d="m18 15-6-6-6 6"/>'
      };
      return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">${paths[name] || paths.info}</svg>`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function render() {
      renderHistory();
      renderContext();
      renderComposerState();
      renderChips();
      renderDrawer();
      renderMessages();
      els.stage.classList.toggle("drawer-closed", !state.drawerOpen);
    }

    function renderHistory() {
      els.historyList.innerHTML = state.sessions.map((session) => `
        <div class="history-item-wrap">
          <button class="history-item ${session.id === state.currentSessionId ? "active" : ""}" data-session-id="${session.id}" title="${escapeHtml(session.title)}">
            <span class="history-icon">Q</span>
            ${state.renamingId === session.id ? 
              `<input class="history-rename-input" data-rename-id="${session.id}" value="${escapeHtml(session.title)}" />` : 
              `<span class="history-text">${escapeHtml(session.title)}</span>`
            }
          </button>
          
          <button class="history-more-btn" data-more-id="${session.id}" title="更多操作">
             <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg>
          </button>
          
          ${state.openDropdownId === session.id ? `
            <div class="history-dropdown" style="top: ${state.dropdownPos.top}; left: ${state.dropdownPos.left};">
              <div class="dropdown-item" data-action-id="${session.id}" data-action="share">
                <svg class="icon" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13" stroke="currentColor" fill="none"/></svg> 分享
              </div>
              <div class="dropdown-item" data-action-id="${session.id}" data-action="pin">
                <svg class="icon" viewBox="0 0 24 24"><path d="M16 4h-8l-1 5-2 1v2h5v8l1 2 1-2v-8h5v-2l-2-1z" stroke="currentColor" fill="none"/></svg> 置顶
              </div>
              <div class="dropdown-item" data-action-id="${session.id}" data-action="rename">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" fill="none"/></svg> 重命名
              </div>
              <div class="dropdown-item danger" data-action-id="${session.id}" data-action="delete">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" fill="none"/></svg> 删除
              </div>
            </div>
          ` : ''}
        </div>
      `).join("");
    }

    function renderContext() {
      if (!state.topic) {
        els.contextBar.innerHTML = '<span class="context-empty">请选择需要分析的主题</span>';
        return;
      }

      els.contextBar.innerHTML = `
        <div class="topic-pill" title="${escapeHtml(state.topic.name)} ${escapeHtml(state.topic.path)}">
          <span class="topic-dot"></span>
          <span class="topic-name">${escapeHtml(state.topic.name)}</span>
          <span class="topic-path">${escapeHtml(state.topic.path)}</span>
        </div>
        <button class="dictionary-open" id="openDrawer">主题字典</button>
      `;
    }

    function renderChips() {
      els.quickChips.innerHTML = demoQuestions.map(q => `
        <button class="chip" type="button" data-question="${escapeHtml(q)}">${escapeHtml(q)}</button>
      `).join("");
    }

    function renderComposerState() {
      const isTopicSelected = Boolean(state.topic);
      els.composerWrap.hidden = !isTopicSelected;
      els.input.disabled = !isTopicSelected;
    }

    function renderDrawer() {
      if (state.drawerMode === "process") {
        renderProcessDrawer();
        return;
      }
      renderDictionaryDrawer();
    }

    function renderDictionaryDrawer() {
      els.drawerTitle.textContent = "主题字典";
      els.dictionaryDrawer.setAttribute("aria-label", "主题字典");
      els.drawerSearch.hidden = false;
      const topic = state.topic || topics.visitor;
      const query = state.dictQuery.trim().toLowerCase();
      if (els.clearDictSearch) {
        els.clearDictSearch.hidden = !query;
      }
      const rows = topic.dict.filter(item => {
        const detailText = getDictionaryDetails(item).map(([label, value]) => `${label} ${value}`).join(" ");
        const text = `${item.field} ${detailText}`.toLowerCase();
        return !query || text.includes(query);
      });

      els.dictTableWrap.innerHTML = rows.length ? `
        <table class="dict-table">
          <thead>
            <tr>
              <th class="field-name">字段名</th>
              <th>业务定义</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td class="field-name ${query && row.field.toLowerCase().includes(query) ? "field-match" : ""}">${escapeHtml(row.field)}</td>
                <td>${renderDefinitionList(row)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      ` : '<div class="empty-dict">未找到匹配字段</div>';
    }

    function renderDictionary() {
      renderDictionaryDrawer();
    }

    function getDictionaryDetails(row) {
      if (Array.isArray(row.details)) return row.details;
      return String(row.desc || "")
        .split("\n")
        .map(item => item.trim())
        .filter(Boolean)
        .map(item => {
          const normalized = item.replace(/^中文名称：[^：\n]+$/, "");
          const separator = normalized.indexOf("：");
          if (separator === -1) return ["定义", normalized];
          return [normalized.slice(0, separator), normalized.slice(separator + 1)];
        })
        .filter(([, value]) => value);
    }

    function renderDefinitionList(row) {
      return `
        <div class="definition-list">
          ${getDictionaryDetails(row).map(([label, value]) => `
            <p class="definition-item"><span class="definition-label">${escapeHtml(label)}：</span>${escapeHtml(value)}</p>
          `).join("")}
        </div>
      `;
    }

    function renderProcessDrawer() {
      els.drawerTitle.textContent = "分析过程";

      const message = getProcessMessage();
      if (!message) {
        els.dictTableWrap.innerHTML = '<div class="empty-dict">暂无可展示的分析过程</div>';
        return;
      }
      const result = message.result;
      const steps = getProcessSteps(result);
      els.dictTableWrap.innerHTML = `
        <div class="drawer-copy">
          <h3>${escapeHtml(result.title)}</h3>
          <p>系统按当前主题边界完成意图识别、参数推导、查询生成与结果校验。</p>

    function getProcessMessage() {
      if (state.activeProcessId) {
        const active = state.messages.find(item => item.id === state.activeProcessId);
        if (active) return active;
      }
      for (let index = state.messages.length - 1; index >= 0; index -= 1) {
        const message = state.messages[index];
        if (message.kind === "answer" && canShowProcess(message.result)) return message;
      }
      return null;
    }

        resizeCommentTextareas();
        if (keepScrollPosition) {

        return `

    function renderFeedback(message) {
      const feedback = message.feedback || "";
      const commentValue = message.commentDraft ?? message.comment ?? "";
      const hasSaved = message.savedComments && message.savedComments.length > 0;
      
      let commentHtml = "";
      if (feedback) {
        if (hasSaved) {
          commentHtml = `
            <div class="saved-comments-wrap">
              <div class="saved-list">
                ${message.savedComments.map(c => `

        } else {

          commentHtml = `

    function canShowProcess(result) {

      const topic = state.topic;

      if (result.type === "multi") return renderMulti(result);
      if (result.type === "system_error") return renderSystemError(result);
      if (result.type === "partial") return renderPartial(result);
      if (result.type === "store_sales" || result.type === "mixed_store_sales") return renderNormal(result);

    function getSmoothPath(points) {
      if (!points.length) return "";
      if (points.length === 1) return `M${points[0][0]} ${points[0][1]}`;

      const tension = 0.18;
      return points.reduce((path, point, index) => {
        if (index === 0) return `M${point[0]} ${point[1]}`;

        const prev = points[index - 1];
        const prevPrev = points[index - 2] || prev;
        const next = points[index + 1] || point;
        const cp1x = prev[0] + (point[0] - prevPrev[0]) * tension;
        const cp1y = prev[1] + (point[1] - prevPrev[1]) * tension;
        const cp2x = point[0] - (next[0] - prev[0]) * tension;
        const cp2y = point[1] - (next[1] - prev[1]) * tension;
        return `${path} C${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${point[0]} ${point[1]}`;
      }, "");
    }

    function renderLineChart(result, displayMetric, unitStr) {
      const values = result.values || [2780, 4740, 2680, 1180, 5820, 4050, 5520];
      const labels = result.labels || ["2025-08-21", "2025-08-22", "2025-08-23", "2025-08-24", "2025-08-25", "2025-08-26", "2025-08-27"];
      const formatPointValue = value => Number(value).toLocaleString("en-US", {
        minimumFractionDigits: Number.isInteger(Number(value)) ? 0 : 2,
        maximumFractionDigits: 2
      });
      const max = result.max || 8000;
      const min = 0;
      const chartLeft = 60;
      const chartRight = 936;
      const chartTop = 50;
      const chartBottom = 220;
      const chartHeight = chartBottom - chartTop;
      const step = labels.length > 1 ? (chartRight - chartLeft) / (labels.length - 1) : 0;
      const points = values.map((value, index) => {
        const x = chartLeft + index * step; 
        const y = chartBottom - ((value - min) / (max - min)) * chartHeight;
        return [x, y];
      });
      const curve = getSmoothPath(points);
      const area = `${curve} L${chartRight} ${chartBottom} L${chartLeft} ${chartBottom} Z`;
      const ticks = [max, max * 0.75, max * 0.5, max * 0.25, 0];
      const tickYs = [50, 92, 135, 177, 220];

      const circlesHtml = points.map(([x, y], index) => {
        const valStr = formatPointValue(values[index]);
        return `<circle cx="${x}" cy="${y}" r="5" fill="#fff" stroke="#3e8cf0" stroke-width="4" 
            class="chart-point" 
            data-date="${escapeHtml(labels[index])}" 
            data-value="${escapeHtml(valStr)}" 
            data-metric="${escapeHtml(displayMetric)}" 
            data-unit="${escapeHtml(unitStr)}" 
        />`;
      }).join("");

      return `
        <div class="metric-row">
          <span class="metric-value">${escapeHtml(result.displayValue || "5,276.33")}<span class="unit"> ${escapeHtml(unitStr)}</span></span>
          <span class="up">${escapeHtml(result.compareText || "日环比 +21.40%")}</span>
        </div>
        <div class="chart-wrap" aria-label="近7日趋势图">
          <svg class="chart-svg" viewBox="0 0 1000 280" role="img" aria-label="近7日趋势折线图">
            <defs>
              <linearGradient id="areaBlue" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stop-color="#6ba8f7" stop-opacity="0.38" />
                <stop offset="100%" stop-color="#6ba8f7" stop-opacity="0.02" />
              </linearGradient>
            </defs>
            <g stroke="#e8edf5" stroke-width="1">
              <path d="M40 50H960" /><path d="M40 92H960" /><path d="M40 135H960" /><path d="M40 177H960" /><path d="M40 220H960" />
            </g>
            <g fill="#8c96a8" font-size="12" font-weight="700" text-anchor="middle">
              ${ticks.map((tick, index) => `<text x="34" y="${tickYs[index] + 4}" text-anchor="end">${escapeHtml(formatPointValue(tick))}</text>`).join("")}
              ${labels.map((label, index) => `<text x="${chartLeft + index * step}" y="256">${escapeHtml(label)}</text>`).join("")}
            </g>
            <path d="${area}" fill="url(#areaBlue)" />
            <path d="${curve}" fill="none" stroke="#3e8cf0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            ${circlesHtml}
          </svg>
        </div>
      `;
    }

    function renderBars(result, displayMetric) {
      const rows = result.bars || [
        ["自然搜索", 34.8],
        ["付费广告", 26.1],
        ["社媒跳转", 19.6],

      const values = rows.map(([, value]) => value);

    }

    function renderSql(result = {}, displayMetric) {
      const topic = state.topic;
      const displayMetricSafe = result.metric || topic.metric;
      const table = topic.key === "payment" ? "dws_payment_success_1d" : "dws_visitor_conversion_1d";
      return `

    function classifyQuestion(question) {
      const q = question.toLowerCase();
      const topicKey = state.topic ? state.topic.key : '';

      if (q.includes("天气") && (q.includes("售卖情况") || q.includes("分析店铺"))) return "mixed_store_sales";

      if (q.includes("系统异常") || q.includes("timeout") || q.includes("报错") || q.includes("拒付")) return "system_error";

      if (q.includes("售卖情况") || q.includes("店铺最近")) return "store_sales";
      if (q.includes("同时分析")) return "multi";
      if (q.includes("文案") || q.includes("天气") || q.includes("小说") || q.includes("翻译") || q.includes("下雨")) return "unrelated";
      if (topicKey === 'visitor' && (q.includes("gmv") || q.includes("支付") || q.includes("成功率"))) return "topic_mismatch";
      if (topicKey === 'payment' && (q.includes("访客") || q.includes("转化") || q.includes("roi") || q.includes("投放") || q.includes("杯量"))) return "topic_mismatch";
      if (q.includes("roi") || q.includes("投放")) return "partial";
      if (q.includes("火星") || q.includes("不存在") || q.includes("无数据")) return "no_data";
      if (q.includes("退款") || q.includes("库存") || q.includes("客诉")) return "out_scope";
      if (q.includes("怎么样") || q.includes("这个") || q.trim().length < 5) return "clarify";

      return "normal";
    }

      els.toast.textContent = text;
      els.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {

    function positionChartTooltip(event) {
      const tooltip = document.getElementById("chartTooltip");
      if (!tooltip) return;
      const offset = 15;
      const rect = tooltip.getBoundingClientRect();
      let left = event.clientX + offset;
      let top = event.clientY + offset;

      if (left + rect.width > window.innerWidth - 12) {
        left = event.clientX - rect.width - offset;
      }
      if (top + rect.height > window.innerHeight - 12) {
        top = event.clientY - rect.height - offset;
      }

      tooltip.style.left = `${Math.max(12, left)}px`;
      tooltip.style.top = `${Math.max(12, top)}px`;
    }

    document.addEventListener("click", event => {
      const moreBtn = event.target.closest('.history-more-btn');
      if (moreBtn) {
         event.stopPropagation();
         const sid = moreBtn.dataset.moreId;
         if (state.openDropdownId === sid) {
             state.openDropdownId = null;
         } else {
             state.openDropdownId = sid;
             const rect = moreBtn.getBoundingClientRect();
             state.dropdownPos = {
                 top: (rect.bottom + 4) + 'px',
                 left: (rect.right - 140) + 'px'
             };
         }
         renderHistory();
         return;
      }
      
      if (!event.target.closest('.history-dropdown') && !event.target.closest('.history-more-btn')) {
          if (state.openDropdownId) {
              state.openDropdownId = null;
              renderHistory();
          }
      }

      const actionBtn = event.target.closest("[data-action]");
      if (actionBtn) {
          const action = actionBtn.dataset.action;
          
          if (["share", "pin", "rename", "delete"].includes(action)) {
              const sid = actionBtn.dataset.actionId;
              state.openDropdownId = null; 
              
              if (action === 'rename') {
                  enableRename(sid);
              } else if (action === 'delete') {
                  state.sessions = state.sessions.filter(s => s.id !== sid);
                  if (state.currentSessionId === sid) {
                      newConversation();
                  } else {
                      renderHistory();
                  }
                  showToast("已删除会话");
              } else if (action === 'share') {
                  renderHistory();
                  showToast("已生成分享链接");
              } else if (action === 'pin') {
                  renderHistory();
                  showToast("已置顶该会话");
              }
              return;
          }

          if (action === "toggle-params") {
            const block = actionBtn.closest('.analysis-block');
            if (block) {
                block.classList.toggle('is-open');
            }
            return;
          }

          if (action === "toggle-multi-result") {
            const key = actionBtn.dataset.multiKey;
            state.multiExpanded[key] = !state.multiExpanded[key];
            state.keepScrollPosition = true;
            render();
            return;
          }
          
          if (action === "open-process") {
            state.drawerMode = "process";
            state.activeProcessId = actionBtn.dataset.processId;
            state.drawerOpen = true;
            state.keepScrollPosition = true;
            render();
            return;
          }
      }

      const domainToggle = event.target.closest("[data-domain-toggle]");
      if (domainToggle) {
        const domain = domainToggle.dataset.domainToggle;
        state.topicTree[domain] = !state.topicTree[domain];
        state.keepScrollPosition = true;
        render();
        return;
      }

      const topicButton = event.target.closest("[data-topic]");
      if (topicButton) {
        selectTopic(topicButton.dataset.topic);
        return;
      }

      const questionButton = event.target.closest("[data-question]");
      if (questionButton) {
        sendQuestion(questionButton.dataset.question);
        return;
      }

      const viewButton = event.target.closest("[data-view]");
      if (viewButton) {
        state.activeView = viewButton.dataset.view;
        state.keepScrollPosition = true;
        render();
        return;
      }

      // 【核心逻辑】：点击反馈按钮
      const feedbackButton = event.target.closest("[data-feedback-id]");
      if (feedbackButton) {
        const msgId = feedbackButton.dataset.feedbackId;
        const message = state.messages.find(item => item.id === msgId);
        if (!message) return;
        const nextFeedback = feedbackButton.dataset.feedback;
        
        if (message.feedback !== nextFeedback) {
          message.feedback = nextFeedback;
          message.savedComments = []; 
          message.commentDraft = "";
          message.comment = "";
        } else {
          message.feedback = "";
          message.savedComments = [];
          message.commentDraft = "";
          message.comment = "";
        }
        
        syncSession();
        state.keepScrollPosition = true; // 阻止默认瞬间置底
        render();
        showToast(message.feedback === "like" ? "已赞，可补充评论" : message.feedback === "dislike" ? "已踩，可补充评论" : "已取消评价");
        
        // 核心优化：平滑滚动到评论区并聚焦
        if (message.feedback) {
          setTimeout(() => {
            const commentInput = document.querySelector(`[data-comment-input="${msgId}"]`);
            if (commentInput) {
              const feedbackWrap = commentInput.closest('.answer-feedback');
              if (feedbackWrap) {
                // 丝滑滚动到可视区域的底部
                feedbackWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              }
              // 自动聚焦输入框引导用户输入
              setTimeout(() => {
                commentInput.focus();
              }, 150);
            }
          }, 30);
        }
        
        return;
      }

      const commentSaveButton = event.target.closest("[data-comment-save]");
      if (commentSaveButton) {
        const message = state.messages.find(item => item.id === commentSaveButton.dataset.commentSave);
        if (!message) return;
        const input = document.querySelector(`[data-comment-input="${message.id}"]`);
        const textVal = input ? input.value.trim() : "";
        
        if (textVal) {
          if (!message.savedComments) message.savedComments = [];
          const now = new Date();
          const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
          
          message.savedComments.push({ text: textVal, time: timeStr });
          message.commentDraft = ""; 
          syncSession();
          state.keepScrollPosition = true;
          render();
          showToast("评论已保存");
        } else {
          showToast("评论不能为空");
        }
        return;
      }

      if (event.target.closest("#openDrawer")) {
        state.drawerMode = "dictionary";
        state.drawerOpen = true;
        state.keepScrollPosition = true;
        render();
        return;
      }

      if (event.target.closest("#closeDrawer")) {
        state.drawerOpen = false;
        state.keepScrollPosition = true;
        render();
        return;
      }

      const historyButton = event.target.closest("[data-session-id]");
      if (historyButton) {
        switchSession(historyButton.dataset.sessionId);
      }
    });

    document.addEventListener("dblclick", event => {
       const historyText = event.target.closest(".history-text");
       if (historyText) {
          const btn = historyText.closest(".history-item");
          if (btn) {
              enableRename(btn.dataset.sessionId);
          }
       }
    });

    document.addEventListener('focusout', e => {
       if (e.target.classList.contains('history-rename-input')) {
           saveRename(e.target.dataset.renameId, e.target.value);
       }
    });

    document.addEventListener("input", event => {
      const commentInput = event.target.closest("[data-comment-input]");
      if (!commentInput) return;
      const message = state.messages.find(item => item.id === commentInput.dataset.commentInput);
      if (message) {
        message.commentDraft = commentInput.value;
      }
      const saveButton = document.querySelector(`[data-comment-save="${commentInput.dataset.commentInput}"]`);
      if (saveButton) {
        saveButton.disabled = !commentInput.value.trim();
      }
      resizeCommentTextareas(commentInput.parentElement || document);
    });

    document.querySelector('.history').addEventListener('scroll', () => {
      if (state.openDropdownId) {
         state.openDropdownId = null;
         renderHistory();
      }
    }, {passive: true});

    document.getElementById("newChat").addEventListener("click", () => {
      document.body.classList.remove("nav-open");
      newConversation();
    });

    document.getElementById("quickInsightEntry").addEventListener("click", () => {
      document.body.classList.remove("nav-open");
      showToast("已进入 QuickInsight");
    });

    document.getElementById("menuButton").addEventListener("click", () => {
      const isOpen = document.body.classList.toggle("nav-open");
      showToast(isOpen ? "侧边栏已展开" : "侧边栏已收起");
    });

    document.addEventListener("click", event => {
      if (!document.body.classList.contains("nav-open")) return;
      if (event.target.closest(".platform-menu") || event.target.closest(".sidebar") || event.target.closest("#menuButton")) return;
      document.body.classList.remove("nav-open");
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        document.body.classList.remove("nav-open");
      }
      if (event.target.classList.contains('history-rename-input') && event.key === 'Enter') {
         saveRename(event.target.dataset.renameId, event.target.value);
      }
    });

    document.addEventListener("mouseover", event => {
      const point = event.target.closest(".chart-point");
      if (!point) return;

      const tooltip = document.getElementById("chartTooltip");
      if (!tooltip) return;

      const date = point.dataset.date || "-";
      const metric = point.dataset.metric || "指标";
      const value = point.dataset.value || "-";
      const unit = point.dataset.unit || "";

      tooltip.innerHTML = `
        <div class="chart-tooltip-context">日期: ${escapeHtml(date)}</div>
        <div class="chart-tooltip-metric">${escapeHtml(metric)}: <span class="chart-tooltip-value">${escapeHtml(value)}${escapeHtml(unit)}</span></div>
      `;
      tooltip.setAttribute("aria-hidden", "false");
      tooltip.classList.add("show");
      positionChartTooltip(event);
    });

    document.addEventListener("mousemove", event => {
      if (!event.target.closest(".chart-point")) return;
      positionChartTooltip(event);
    });

    document.addEventListener("mouseout", event => {
      const point = event.target.closest(".chart-point");
      if (!point) return;
      const tooltip = document.getElementById("chartTooltip");
      if (!tooltip) return;
      tooltip.classList.remove("show");
      tooltip.setAttribute("aria-hidden", "true");
    });

    els.composer.addEventListener("submit", event => {
      event.preventDefault();
      sendQuestion(els.input.value);
    });

    els.input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendQuestion(els.input.value);
      }
    });

    els.dictSearch.addEventListener("input", event => {
      state.dictQuery = event.target.value;
      renderDictionary();
    });

    els.clearDictSearch.addEventListener("click", () => {
      state.dictQuery = "";
      els.dictSearch.value = "";
      renderDictionary();
      els.dictSearch.focus();
    });

    render();
  </script>
</body>
</html>
